<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portinelli — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070605;--gold:#e8b04a;--gold-light:#ffd98a;--gold-deep:#9a6a1c;--text:#f3ead8;--muted:#a99a80;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(232,176,74,.18), transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%, rgba(232,176,74,.10), transparent 70%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex;justify-content:center;padding:32px 18px 48px;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .cover{width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;position:relative;border:1px solid rgba(232,176,74,.45);box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 20px 60px rgba(232,176,74,.18), 0 0 120px rgba(232,176,74,.08);}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .handle{margin-top:26px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.14em;font-size:1.05rem;color:var(--gold-light);}
  .tagline{margin-top:8px;color:var(--muted);font-size:.92rem;line-height:1.5;max-width:340px}
  .divider{display:flex;align-items:center;gap:12px;width:100%;margin:26px 0 22px}
  .divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-deep),transparent)}
  .divider svg{width:26px;height:18px;flex:none}
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(232,176,74,.35);transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;overflow:hidden;}
  .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,217,138,.18) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s ease;}
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 10px 30px rgba(232,176,74,.22);background:linear-gradient(180deg,rgba(232,176,74,.10),rgba(232,176,74,.03));outline:none;}
  .btn:hover::after{transform:translateX(100%)}
  .btn:active{transform:translateY(0)}
  .icon{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,var(--gold-light),var(--gold) 45%,var(--gold-deep));box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 14px rgba(232,176,74,.3);}
  .icon svg{width:22px;height:22px;fill:#1a1206}
  .label{flex:1;text-align:left}
  .label strong{display:block;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em;font-size:1rem;color:var(--gold-light)}
  .label small{display:block;margin-top:3px;color:var(--muted);font-size:.8rem}
  .arrow{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;opacity:.8;transition:transform .2s}
  .btn:hover .arrow{transform:translateX(3px)}
  .btn.primary{border-color:var(--gold);background:linear-gradient(180deg,rgba(232,176,74,.16),rgba(232,176,74,.05));box-shadow:0 0 0 1px rgba(232,176,74,.15), 0 10px 34px rgba(232,176,74,.16);}
  footer{margin-top:34px;color:#6f6553;font-size:.75rem;letter-spacing:.12em;font-family:'Cinzel',serif}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
